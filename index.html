<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Orientación · Santo Cura de Ars</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <meta name="theme-color" content="#1E3A5F">
  <script src="lib/supabase.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav id="nav-bar">
    <div class="nav-logo">✦</div>
    <div class="nav-title">Orientación · Santo Cura de Ars</div>
    <span class="nav-sub" id="nav-user" style="display:none"></span>
    <span class="nav-badge" id="nav-badge" style="display:none"></span>
    <button class="btn btn-ghost btn-sm" id="btn-login">Acceso</button>
  </nav>
  <div class="main" id="main"></div>
  <div id="toast"></div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'activated') {
              window.location.href = window.location.pathname + '?v=' + Date.now();
            }
          });
        });
      });

      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data?.type === 'SW_UPDATED') {
          window.location.href = window.location.pathname + '?v=' + Date.now();
        }
      });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
